name: build-f50-kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bison flex libssl-dev bc gcc-aarch64-linux-gnu python3 xz-utils

      - name: Download kernel tree + clang12 toolchain (release assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download assets --pattern '*.tar.gz' --repo ${{ github.repository }} -D /tmp/dl || true
          ls -la /tmp/dl

      - name: Extract
        run: |
          mkdir -p /opt/clang
          tar xzf /tmp/dl/clang12_toolchain.tar.gz -C /opt
          tar xzf /tmp/dl/f50_tree254p302.tar.gz -C $GITHUB_WORKSPACE
          rm -rf /tmp/dl
          ls $GITHUB_WORKSPACE/bsp/kernel5.4/kernel5.4 | head -5
          /opt/clang/clang-r416183b/bin/clang --version | head -2

      - name: Apply fixup patches
        run: |
          cd $GITHUB_WORKSPACE/bsp/kernel5.4/kernel5.4
          sed -i '/static inline int timer_delete_sync/,/^}/d' include/linux/timer.h
          sed -i 's|struct dst_entry \*\t(\*negative_advice)(struct dst_entry \*);|void\t\t\t(*negative_advice)(struct sock *sk, struct dst_entry *);|' include/net/dst_ops.h
          python3 $GITHUB_WORKSPACE/fix_trace.py
          cp $GITHUB_WORKSPACE/vendor_loop.c drivers/block/loop.c
          cp $GITHUB_WORKSPACE/vendor_sprd_serial.c drivers/tty/serial/sprd_serial.c
          cp $GITHUB_WORKSPACE/regdb_sforshee_2024.hex net/wireless/certs/sforshee.hex
          # module_layout ABI: revert struct-changing 5.4.y hunks (perf_event group_generation/lost_samples, hrtimer online bit, cred atomic_long)
          cp $GITHUB_WORKSPACE/vendor_perf_event.h include/linux/perf_event.h
          cp $GITHUB_WORKSPACE/vendor_hrtimer.h include/linux/hrtimer.h
          cp $GITHUB_WORKSPACE/vendor_cred.h include/linux/cred.h
          cp $GITHUB_WORKSPACE/vendor_core.c kernel/events/core.c
          cp $GITHUB_WORKSPACE/vendor_ring_buffer.c kernel/events/ring_buffer.c
          cp $GITHUB_WORKSPACE/vendor_hrtimer_c.c kernel/time/hrtimer.c
          cp $GITHUB_WORKSPACE/vendor_cred_c.c kernel/cred.c
          grep -c timer_delete_sync include/linux/timer.h

      - name: Build kernel (5.4.302 code, vermagic 254 spoof)
        run: |
          set -o pipefail
          bash f50_build.sh 2>&1 | tee build_log.txt

      - name: Checks
        run: |
          grep -a module_layout out/kernel/module.o.symversions || true
          grep module_layout out/Module.symvers || true
          strings out/vmlinux | grep -m1 'Linux version 5' || true

      - name: Upload artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f50-kernel-302
          path: |
            out/arch/arm64/boot/Image
            out/Module.symvers
            out/drivers/block/zram/zram.ko
            build_log.txt
          retention-days: 14
