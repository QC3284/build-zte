name: build-f50-kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bison flex libssl-dev bc gcc-aarch64-linux-gnu python3 xz-utils

      - name: Download kernel tree + clang12 toolchain (release assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download assets --pattern '*.tar.gz' --repo ${{ github.repository }} -D /tmp/dl || true
          ls -la /tmp/dl

      - name: Extract
        run: |
          mkdir -p /opt/clang
          tar xzf /tmp/dl/clang12_toolchain.tar.gz -C /opt
          tar xzf /tmp/dl/f50_tree_302.tar.gz -C /home/runner/work/build-zte
          rm -rf /tmp/dl
          ls /home/runner/work/build-zte/w205ds_276 | head -5
          /opt/clang/clang-r416183b/bin/clang --version | head -2

      - name: Build kernel (5.4.302 code, vermagic 254 spoof)
        run: bash f50_build.sh 2>&1 | tee build_log.txt

      - name: Checks
        run: |
          grep -a module_layout out/kernel/module.o.symversions || true
          grep module_layout out/Module.symvers || true
          strings out/vmlinux | grep -m1 'Linux version 5' || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: f50-kernel-302
          path: |
            out/arch/arm64/boot/Image
            out/Module.symvers
            out/drivers/block/zram/zram.ko
            build_log.txt
          retention-days: 14
